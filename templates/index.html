<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>LAHSO - Learning Assisted Hybrid Simulation-Optimization</title>
		<style>
			:root {
				font-family:
					Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
					sans-serif;
				color: #172033;
				background: #f5f7fb;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background:
					linear-gradient(180deg, rgba(21, 181, 138, 0.12), rgba(21, 181, 138, 0)),
					#f5f7fb;
			}

			main {
				width: min(720px, calc(100vw - 32px));
				background: #ffffff;
				border: 1px solid #dbe3ee;
				border-radius: 8px;
				box-shadow: 0 18px 42px rgba(15, 23, 42, 0.1);
				padding: 28px;
			}

			.brand {
				display: flex;
				align-items: center;
				gap: 12px;
				margin-bottom: 18px;
			}

			.mark {
				width: 42px;
				height: 42px;
				border-radius: 8px;
				background: #15b58a;
				color: #ffffff;
				display: grid;
				place-items: center;
				font-weight: 800;
			}

			h1 {
				margin: 0;
				font-size: clamp(28px, 5vw, 42px);
				line-height: 1.08;
				letter-spacing: 0;
			}

			p {
				margin: 12px 0 0;
				color: #64748b;
				line-height: 1.55;
			}

			.actions {
				display: flex;
				flex-wrap: wrap;
				gap: 10px;
				margin-top: 24px;
			}

			a {
				min-height: 42px;
				border-radius: 8px;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				padding: 0 15px;
				font-weight: 750;
				color: #0f766e;
				border: 1px solid #9ddfc7;
				text-decoration: none;
			}

			a.primary {
				background: #15b58a;
				border-color: #15b58a;
				color: #ffffff;
			}
		</style>
	</head>
	<body>
		<main>
			<div class="brand">
				<div class="mark">L</div>
				<div>
					<strong>LAHSO</strong>
					<p>Flask API backend is running.</p>
				</div>
			</div>
			<h1>Learning Assisted Hybrid Simulation-Optimization</h1>
			<p>
				The refactored frontend now lives in the SvelteKit app under <code>frontend/</code>.
				Start it with <code>bun --bun run dev</code> while this Flask process serves the API and
				Socket.IO endpoints.
			</p>
			<div class="actions">
				<a class="primary" href="/api/config/default">View API Defaults</a>
				<a href="http://localhost:5173">Open SvelteKit Dev UI</a>
			</div>
		</main>
	</body>
</html>
